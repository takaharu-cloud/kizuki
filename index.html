<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マエダ Share Note（引っ越しました）</title>

<!-- 2026-10-22 住所を https://maeda-denki.github.io/sharenote/ へ引っ越した。ここは案内だけ（アプリは開かない）。
     通知係（sw.js）と push-config.js は残す：まだ移っていない人にも🔔が届き、タップするとこの案内が開く。
     新しい住所で🔔をオンにすると、その人の古い宛先はサーバーが消す（2回鳴らない） -->
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFD400">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="マエダ Share Note">

<style>
  html, body { margin:0; padding:0; background:#FFFDF4; color:#1A160B; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; line-height:1.6; }
  main { max-width:520px; margin:0 auto; padding:32px 16px 40px; }
  .mark { width:64px; height:64px; border-radius:14px; display:block; margin:0 0 16px; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { margin:0 0 16px; font-size:15px; color:#5A5344; }
  .go { display:block; text-align:center; text-decoration:none; background:#1A160B; color:#FFD400; font-weight:700; font-size:17px;
        min-height:56px; line-height:56px; border-radius:10px; margin:8px 0 8px; }
  .addr { text-align:center; font-size:14px; color:#5A5344; margin:0 0 24px; word-break:break-all; }
  ol { margin:0; padding:16px 16px 16px 36px; background:#fff; border:1px solid #E6DDB8; border-radius:10px; font-size:15px; }
  ol li { margin:0 0 8px; }
  ol li:last-child { margin:0; }
  .note { font-size:13px; margin-top:16px; }
</style>
</head>
<body>
<main>
  <img class="mark" src="icon.png" alt="">
  <h1>Share Note の住所が変わりました</h1>
  <p>このアイコン（古い住所）は使えなくなりました。新しい住所から開いてください。</p>
  <a class="go" id="go" href="https://maeda-denki.github.io/sharenote/">新しい住所で開く</a>
  <div class="addr">maeda-denki.github.io/sharenote</div>
  <ol>
    <li>上のボタンで新しい住所を開く（iPhone は Safari で）</li>
    <li>「ホーム画面に追加」で新しいアイコンを作る</li>
    <li>新しいアイコンから開き、名前と暗証番号でログイン → 🔔をオン</li>
    <li>この古いアイコンは消してかまいません</li>
  </ol>
  <p class="note">暗証番号を忘れたときは、アプリの管理者に聞いてください。</p>
</main>
<script>
  /* 通知のタップ（#list など）や棚の QR（#shelf=…）で開かれたら、新しい住所の同じ場所へ */
  (function(){
    var h = location.hash || '';
    if (/^#(list|help|memo|shelf(=[-\w]+)?)$/.test(h)) document.getElementById('go').href += h;
  })();
</script>
</body>
</html>
