<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マエダ Share Note</title>

<!-- ホーム画面アイコン（ロゴ）。同じフォルダの icon.png を使う -->
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<!-- スマホでアプリのように全画面表示する設定 -->
<meta name="theme-color" content="#FFD400">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="マエダ Share Note">

<style>
  html, body { margin:0; padding:0; height:100%; background:#FFFDF4; }
  iframe { border:0; width:100%; height:100%; display:block; }
</style>
</head>
<body>
  <!-- マエダ Share Note 本体（Google Apps Script）を全画面で表示します -->
  <iframe
    src="https://script.google.com/macros/s/AKfycbyEgMePg_LtoqIdOesqhrIEi5Mr01EwQ5DbYX_Qy5lW54rzLYDiI7s7jdSiBC3w1MmS/exec"
    allow="camera; clipboard-write"
    title="マエダ Share Note">
  </iframe>
  <script>
  /* ログインの「合い鍵」の控え。中の画面（Googleの側）の記憶がiPhoneに消されても、この包みの記憶から自動で復帰させる。
     ・中の画面からの言葉だけ聞く（Googleのアプリ画面のアドレスから来たものだけ）
     ・暗証番号は扱わない（合い鍵と名前だけ） */
  (function(){
    var KEY = 'snSessionBackup';
    function fromApp(origin){ return /^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/.test(origin) || origin === 'https://script.google.com'; }
    window.addEventListener('message', function(ev){
      if(!fromApp(ev.origin)) return;
      var d = ev.data || {};
      try{
        if(d.type === 'sn-session-save'){ if(d.session && d.session.token){ localStorage.setItem(KEY, JSON.stringify(d.session)); } else { localStorage.removeItem(KEY); } }
        if(d.type === 'sn-session-get'){ var s = null; try{ s = JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(e){} ev.source.postMessage({ type:'sn-session', session:s }, ev.origin); }
      }catch(e){}
    });
  })();
  </script>
</body>
</html>
