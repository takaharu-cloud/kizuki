<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マエダ Share Note</title>

<!-- ホーム画面アイコン（ロゴ）。同じフォルダの icon.png を使う -->
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">

<!-- スマホでアプリのように全画面表示する設定 -->
<meta name="theme-color" content="#FFD400">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="マエダ Share Note">

<style>
  html, body { margin:0; padding:0; height:100%; background:#FFFDF4; }
  iframe { border:0; width:100%; height:100%; display:block; }
  /* 「通知をオンにする」の確認（この包みの画面で押す必要があるため、ここに置く） */
  #pushask { position:fixed; inset:0; z-index:99; background:rgba(26,22,11,.45); display:none; align-items:flex-end; justify-content:center; font-family:'Noto Sans JP',system-ui,sans-serif; }
  #pushask.show { display:flex; }
  #pushask .box { width:100%; max-width:560px; background:#fff; border-radius:12px 12px 0 0; padding:18px 18px 28px; box-shadow:0 -10px 30px -12px rgba(0,0,0,.4); }
  #pushask h2 { margin:0 0 6px; font-size:17px; }
  #pushask p { margin:0 0 14px; font-size:13px; color:#5A5344; line-height:1.6; }
  #pushask .btns { display:flex; gap:10px; }
  #pushask button { flex:1; min-height:48px; border-radius:8px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; }
  #pushask .go { border:none; background:#1A160B; color:#FFD400; }
  #pushask .later { border:1px solid #E6DDB8; background:#fff; color:#5A5344; }
</style>
</head>
<body>
  <!-- マエダ Share Note 本体（Google Apps Script）を全画面で表示します -->
  <iframe
    src="https://script.google.com/macros/s/AKfycbyEgMePg_LtoqIdOesqhrIEi5Mr01EwQ5DbYX_Qy5lW54rzLYDiI7s7jdSiBC3w1MmS/exec"
    allow="camera; clipboard-write"
    title="マエダ Share Note">
  </iframe>

  <div id="pushask" role="dialog" aria-labelledby="pushask-title">
    <div class="box">
      <h2 id="pushask-title">通知をオンにしますか？</h2>
      <p>新しい気づき・相談・つぶやきや、自分の投稿への返信が届いたときにお知らせします。アプリのアイコンにも数が出ます。</p>
      <div class="btns"><button type="button" class="go" id="pushgo">通知をオンにする</button><button type="button" class="later" id="pushlater">あとで</button></div>
    </div>
  </div>

  <script src="push-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" integrity="sha384-AQ3POAMqIhwS81FrUH95ekxqBZHeP5tG2JfEL3+7GuTtfRLWnrRh32UxwzM+//A9" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js" integrity="sha384-XtSlZdmg0Ad5zf0AX4W9TGdm+dGjaNK4KG3lNFjfgbnxkCEuT9ugWXkLExgQTJ+6" crossorigin="anonymous"></script>
  <script>
  /* この包みの仕事は3つ：
     1) ログインの「合い鍵」の控え（中の画面の記憶がiPhoneに消されても復帰させる）
     2) 通知（プッシュ）：許可の確認・端末の宛先（トークン）の取得・アイコンの赤丸の消去
     3) 中の画面（Googleの側）からの言葉だけ聞く。暗証番号は扱わない */
  (function(){
    var KEY = 'snSessionBackup';
    function fromApp(origin){ return /^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/.test(origin) || origin === 'https://script.google.com'; }
    var appWin = null, appOrigin = '';
    function reply(msg){ try { if(appWin) appWin.postMessage(msg, appOrigin); } catch(e){} }

    /* ---- 通知の準備 ---- */
    var cfg = (window.SN_PUSH && window.SN_PUSH.firebase) || {};
    var configured = !!(cfg.apiKey && cfg.projectId && window.SN_PUSH.vapidKey);
    var swReg = null, messaging = null;
    function standalone(){ return !!(window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)); }
    function supported(){ return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window); }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(function(r){ swReg = r; }).catch(function(){});
    }
    function getMessaging(){
      if (messaging) return messaging;
      if (!configured || !window.firebase || !firebase.messaging || !firebase.messaging.isSupported()) return null;
      try { if (!firebase.apps.length) firebase.initializeApp(cfg); messaging = firebase.messaging(); } catch(e){ messaging = null; }
      return messaging;
    }
    function currentToken(){   // 許可済みのときだけ、端末の宛先を取る（許可の確認は出さない）
      var m = getMessaging();
      if (!m || Notification.permission !== 'granted') return Promise.resolve('');
      var ready = swReg ? Promise.resolve(swReg) : navigator.serviceWorker.ready;
      return ready.then(function(r){ swReg = r; return m.getToken({ vapidKey: window.SN_PUSH.vapidKey, serviceWorkerRegistration: r }); }).catch(function(){ return ''; });
    }
    function sendStatus(){
      var st = { type:'sn-push-status', configured: configured, supported: supported(), standalone: standalone(),
                 ios: /iPhone|iPad|iPod/.test(navigator.userAgent), permission: ('Notification' in window) ? Notification.permission : 'unsupported', token:'' };
      currentToken().then(function(t){ st.token = t || ''; reply(st); });
    }
    function clearBadge(){
      try { if (navigator.clearAppBadge) navigator.clearAppBadge(); } catch(e){}
      var ready = swReg ? Promise.resolve(swReg) : (('serviceWorker' in navigator) ? navigator.serviceWorker.ready : Promise.reject());
      ready.then(function(r){ return r.getNotifications(); }).then(function(ns){ ns.forEach(function(n){ n.close(); }); }).catch(function(){});
    }
    var ask = document.getElementById('pushask');
    document.getElementById('pushlater').addEventListener('click', function(){ ask.classList.remove('show'); reply({ type:'sn-push-later' }); });
    document.getElementById('pushgo').addEventListener('click', function(){
      ask.classList.remove('show');
      if (!supported()) { sendStatus(); return; }
      Notification.requestPermission().then(function(p){
        if (p !== 'granted') { sendStatus(); return; }
        return currentToken().then(function(t){ if (t) reply({ type:'sn-push-token', token: t }); sendStatus(); });
      }).catch(function(){ sendStatus(); });
    });
    document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') clearBadge(); });

    window.addEventListener('message', function(ev){
      if(!fromApp(ev.origin)) return;
      var d = ev.data || {};
      appWin = ev.source; appOrigin = ev.origin;
      try{
        if(d.type === 'sn-session-save'){ if(d.session && d.session.token){ localStorage.setItem(KEY, JSON.stringify(d.session)); } else { localStorage.removeItem(KEY); } }
        if(d.type === 'sn-session-get'){ var s = null; try{ s = JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(e){} reply({ type:'sn-session', session:s }); }
        if(d.type === 'sn-push-status'){ sendStatus(); }
        if(d.type === 'sn-push-enable'){ if (supported() && Notification.permission === 'granted') { currentToken().then(function(t){ if (t) reply({ type:'sn-push-token', token:t }); sendStatus(); }); } else { ask.classList.add('show'); } }
        if(d.type === 'sn-push-disable'){ var m = getMessaging(); (m ? m.deleteToken().catch(function(){}) : Promise.resolve()).then(sendStatus); }
        if(d.type === 'sn-badge-clear'){ clearBadge(); }
      }catch(e){}
    });
  })();
  </script>
</body>
</html>
